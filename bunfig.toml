[install]
# One-day supply-chain delay (the policy deno.json's minimumDependencyAge
# enforced). The first-party JSR dependency is excluded so a just-published
# release resolves.
minimumReleaseAge = 86400
minimumReleaseAgeExcludes = ["@jsr/wazoo__sparql-engine"]

[install.scopes]
# JSR packages resolve through JSR's npm compatibility layer.
"@jsr" = "https://npm.jsr.io"
