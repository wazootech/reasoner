name: Publish

# Releases @wazoo/reasoner to JSR when a merge to main carries a jsr.json
# version that JSR does not have yet. Routine merges (version unchanged) skip
# cleanly. Publishing uses GitHub OIDC, so the JSR package must be linked to
# this repository (jsr.io/@wazoo/reasoner/settings → GitHub repository).

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run ci
      - run: bun run test:parity
      - run: bun run publish:dry
      - name: Check whether this merge is a release
        id: release-check
        run: |
          version=$(jq -r .version jsr.json)
          # A 404 means the package has never been published: any version is new.
          status=$(curl -s -o /tmp/jsr-meta.json -w "%{http_code}" https://jsr.io/@wazoo/reasoner/meta.json)
          if [ "$status" = "404" ]; then
            published=false
          elif [ "$status" = "200" ]; then
            published=$(jq --arg v "$version" '.versions | has($v)' /tmp/jsr-meta.json)
          else
            echo "::error::jsr.io returned HTTP $status for the package metadata."
            exit 1
          fi
          echo "local version: $version / already published: $published"
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - name: Publish to JSR
        if: steps.release-check.outputs.published == 'false'
        run: bunx jsr publish
      - name: No release needed
        if: steps.release-check.outputs.published == 'true'
        run: echo "::notice::This version is already on JSR; nothing to release."
