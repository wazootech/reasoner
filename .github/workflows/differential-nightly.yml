name: Differential nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: Number of random seeds
        required: false
        default: "5000"

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - run: deno install --frozen
      - run: deno task test:differential --seeds "$SEEDS"
        env:
          SEEDS: ${{ inputs.seeds || '5000' }}
