name: Differential nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: Number of random seeds
        required: false
        default: "5000"

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task test:differential --seeds "$SEEDS"
        env:
          SEEDS: ${{ inputs.seeds || '5000' }}
